<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay Test</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: start; vertical-align: top; }
    td:nth-child(2), td:nth-child(3) { white-space: nowrap; }
    .ok { color: #16a34a; font-weight: 600; }
    .bad { color: var(--danger-bd); font-weight: 600; }
    code { overflow-wrap: anywhere; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Relay test</h1>
    <p class="muted">Checks your connection, your Cloudflare relay and the public relays with a few sites. Send a screenshot of the table.</p>
    <button id="run">Run test again</button>
    <table>
      <thead><tr><th>Test</th><th>Result</th><th>Time</th><th>Answer starts with</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script type="module">
    import { PROXY_URL } from "./js/config.js";
    import { encodeForRelay } from "./js/feeds.js";
    const relay = (u) => `${PROXY_URL.replace(/\/$/, "")}/r/${encodeForRelay(u)}`;
    const TESTS = [
      ["Your internet (weather, direct)", "https://api.open-meteo.com/v1/forecast?latitude=32&longitude=34.8&current=temperature_2m"],
      ["Your relay (just checking it's up)", `${PROXY_URL.replace(/\/$/, "")}/`],
      ["Your relay → Hebcal", relay("https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&year=now&month=1")],
      ["Your relay → BBC", relay("https://feeds.bbci.co.uk/news/world/rss.xml")],
      ["Your relay → Times of Israel", relay("https://www.timesofisrael.com/feed/")],
      ["Your relay → Ynet", relay("https://www.ynet.co.il/Integration/StoryRss2.xml")],
      ["Your relay → The Verge", relay("https://www.theverge.com/rss/index.xml")],
      ["Public relay 1 → BBC", `https://api.allorigins.win/raw?url=${encodeURIComponent("https://feeds.bbci.co.uk/news/world/rss.xml")}`],
      ["Public relay 2 → BBC", `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent("https://feeds.bbci.co.uk/news/world/rss.xml")}`],
    ];
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

    async function test(url) {
      const t0 = performance.now();
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 20000);
      try {
        const res = await fetch(url, { signal: ctl.signal, cache: "no-store" });
        const body = await res.text();
        return { ok: res.ok, result: `HTTP ${res.status}`, ms: performance.now() - t0, body: body.trim().slice(0, 60) };
      } catch (err) {
        const why = ctl.signal.aborted ? "no answer (20s)" : err instanceof TypeError ? "couldn't connect" : err.message;
        return { ok: false, result: why, ms: performance.now() - t0, body: "" };
      } finally {
        clearTimeout(timer);
      }
    }

    async function run() {
      const rows = document.getElementById("rows");
      rows.innerHTML = TESTS.map(([name]) => `<tr><td>${esc(name)}</td><td class="muted">testing…</td><td></td><td></td></tr>`).join("");
      await Promise.all(TESTS.map(async ([, url], i) => {
        const r = await test(url);
        rows.children[i].innerHTML =
          `<td>${esc(TESTS[i][0])}</td><td class="${r.ok ? "ok" : "bad"}">${r.ok ? "✓ " : "✗ "}${esc(r.result)}</td>` +
          `<td>${(r.ms / 1000).toFixed(1)}s</td><td><code>${esc(r.body)}</code></td>`;
      }));
    }
    document.getElementById("run").onclick = run;
    run();
  </script>
</body>
</html>
